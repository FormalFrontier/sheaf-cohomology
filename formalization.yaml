# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "sheaf-cohomology"
  description: >-
    Compact-open filtered section colimits, quasi-flasque acyclicity, sheaf
    cohomology and right-derived pushforward, native sheafed-space limits and
    pullback cocones, coefficient-forgetting comparisons, and global and
    compact-open cylinder sections of spectral inverse limits. Generic
    open-variable restrictions and principal-tail changes compare the actual
    section diagrams for arbitrary original cones; invertibility of the
    specialized comparisons has additional hypotheses.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Sheaf cohomology, compact-open colimits, pullback and open base change"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical constructions formalized using native mathlib sheaves, limits,
      Ext and derived functors; no mathematical novelty or source-author
      endorsement is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivation for compact-open, quasi-flasque and cohomological arguments;
      no claim of complete source formalization. Passage correspondences and
      remaining gaps are maintained separately from this reusable library.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Native categories, sheaves, sheafification, stalks, Ext, injective
      resolutions and derived functors at pinned revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5, Lean v4.34.0-rc2.
  - id: "https://github.com/FormalFrontier/spectral-stone-duality"
    relationship: "builds-on"
    note: >-
      Spectral limit-cylinder criterion at official published revision
      452b7b7be1bea76434cd083b1019a26f96b4ab30; its official
      ideal-completion dependency is 001e3b7508184ecd51e0d86177cb1d54508bf59d.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake and Git for formalization,
        examples, documentation and distinct-execution independent review.
  notes: >-
    Contributor and adaptation credits are in docs/CREDITS.md and repository
    history. No human peer review, source-author approval, model-cost estimate
    or current-tree performance measurement is inferred.

status:
  scope: >-
    A 103-module Lean library with compact-open filtered comparisons,
    quasi-flasque and derived-cohomological results, conditional constructed
    native limits and their forgetful comparisons, and spectral inverse-limit
    global and cylinder sections. Generic open-variable naturality and
    transition-pullback principal-tail comparisons are arrow-level results
    for actual diagrams and original cones; neither proves an all-open
    isomorphism, unconditional global limits nor source-level coverage.
    Examples include both public named examples and private clients.
    The historical generated docs/API.md covers 26 original modules only;
    consult the focused guides for later modules and exact hypotheses.
  main_results:
    - declaration: SheafCohomology.CompactOpenSections.preservesColimit_sections
      file: SheafCohomology/CompactOpenSections.lean
    - declaration: TopCat.Sheaf.IsQuasiFlasque.subsingleton_H_succ
      file: SheafCohomology/QuasiFlasqueAcyclicity.lean
    - declaration: SheafCohomology.HigherDirectImageFilteredColimit.rightDerivedPushforward_colimitPost_isIso
      file: SheafCohomology/HigherDirectImageFilteredColimit.lean
    - declaration: AlgebraicGeometry.SheafedSpace.isLimit_of_isLimit_forget_of_isColimit_conePullbackCocone
      file: SheafCohomology/ConePullbackLimit.lean
    - declaration: AlgebraicGeometry.SheafedSpace.AbelianForget.preservesCofilteredLimit
      file: SheafCohomology/AbelianForget/LimitPreservation.lean
    - declaration: AlgebraicGeometry.SheafedSpace.CommRingForget.preservesCofilteredLimit
      file: SheafCohomology/CommRingForget/LimitPreservation.lean
    - declaration: AlgebraicGeometry.SheafedSpace.isIso_nativeCommRingGlobalSectionsComparison
      file: SheafCohomology/NativeCommRingGlobalSections.lean
    - declaration: AlgebraicGeometry.SheafedSpace.NativeCylinderLimit.isIso_nativeCommRingCylinderSectionsComparison
      file: SheafCohomology/NativeCommRingCylinderSections.lean
    - declaration: AlgebraicGeometry.SheafedSpace.NativeCylinderLimit.cylinderSectionsNaturality
      file: SheafCohomology/NativeCylinderOpenNaturality.lean
    - declaration: AlgebraicGeometry.SheafedSpace.NativeCylinderLimit.cylinderSectionsComparison_betweenTail
      file: SheafCohomology/NativeCylinderTailChange.lean

review:
  status: "other: historical mathematical review is distinct from revision-specific acceptance"
  notes: >-
    The mathematical library had distinct-execution agent review before its
    prior private release. Build, complete standard-axiom and independent
    mathematical/API/rights decisions apply only to the exact revisions they
    assessed; this metadata is not itself an acceptance certificate for any
    successor. No human or source-author endorsement is asserted.

acknowledgements: >-
  Lean and mathlib contributors for the proof assistant and upstream APIs;
  Andrew Yang for the Apache-2.0 mathlib open-immersion work adapted in native
  restriction; Formal Frontier contributors, reviewers and maintainers. See
  docs/CREDITS.md for credits and third-party provenance. Collective project
  author credit does not assert copyright ownership or supersede upstream terms.
