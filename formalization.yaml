# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "sheaf-cohomology"
  description: >-
    Compact-open section colimits, quasi-flasque exactness and acyclicity,
    resolution comparisons, local cohomology, right-derived pushforward
    comparisons, pullback coherence, commuting-square transitions and their
    additive-to-Type forgetful compatibility, open base
    change and the forgetful functor from abelian-group sheaves to Type-valued
    sheaves in Lean.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Sheaf cohomology, compact-open colimits, pullback and open base change"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical mathematical constructions implemented using native mathlib
      sheaves, limits, Ext and derived-functor infrastructure. No mathematical
      novelty or approval by human authors is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating compact-open, quasi-flasque and cohomological mathematics.
      Detailed passage correspondence, hypotheses and remaining source gaps
      are tracked separately; this metadata makes no source-coverage claim.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Uses native category-theoretic limits, sheafification, stalks, Ext,
      injective resolutions and right-derived functors at mathlib revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5, with Lean v4.34.0-rc2.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and the Hive task
        environment for development, independent review and maintenance.
  notes: >-
    Different agent executions author and independently review substantive
    candidates. No human peer review or source-author endorsement is inferred.
    Unverified model identities, project-wide costs and performance measurements
    are omitted.

status:
  scope: >-
    Reusable sheaf-cohomological APIs under each declaration's actual category,
    topology, sheafification, Ext and universe assumptions. The positive
    local-cohomology/right-derived comparison has a shared universe parameter
    and requires positive degree. Sheaf-specific functorial flasque-resolution
    and higher-direct-image filtered-colimit assemblies are fixed at universe
    zero. The additive-to-Type underlying-sheaf functor commutes with pullback
    through a canonical natural mate for arbitrary same-universe spaces and maps;
    it preserves same-universe filtered colimits with a literal colimit.post
    comparison and its stage law. Generic commuting-square transitions use the
    native concrete-category pullback adjunction and satisfy the forward strict
    mate, target naturality, identity and arbitrary pasting laws. For arbitrary
    same-universe commuting squares and additive pullback stages, forgetting
    commutes with the literal native transition to Type-valued sheaves through
    the canonical pullback comparison; strict pushforward objects, maps and
    square comparisons supply the bridge. No final additive endpoint is claimed.
    No new global preservation instance, full
    theory, arbitrary-universe wrapper or whole-source completion is asserted.

review:
  status: "other: independently reviewed mathematical development; release decisions are revision-specific"
  notes: >-
    Accepted development main a9f1a38787d33205c469ff89710563fffb4974fd
    integrates independently reviewed mathematical units and the bounded
    module/public-use and metadata readiness work in issue 34 (ordinary review
    3006, owner record 34-40581 and integration 40588, main verification
    40654/40674). These historical checks are distinct from revision-specific
    release assessment: an applicable successful pinned build and complete
    transitive standard-axiom audit, including private declarations and examples,
    combined with lightweight independent source/API/documentation/metadata,
    rights, dependency and release-tree/history review. Only propext,
    Classical.choice and Quot.sound are permitted axioms. The ordinary Lean
    build checks the proofs; separate stored-body replay is not required.
    Publication and exact mirror verification are separate operations; this
    metadata makes no claim of public repository visibility. The AbelianForget
    transfer is a new destination candidate drawing on separately accepted
    incubator proofs; it requires its own independent promotion/release review.
    That earlier approval is not acceptance of this destination or its release.
    The separate SquareTransition transfer likewise requires exact destination
    promotion/release assessment; historical native documentation does not
    include either transfer's new subjects. The forgetful-square successor
    starts from frozen Square assembly dfc42b3001c29d9384532c489474b4c36dd6e069;
    the accepted incubator source is d6135ec9832e5ff93d267fb2c1eaeb0aa2ea1eed.
    This successor still needs independent exact-candidate review, responsible
    maintainer acceptance and verified publication before it is delivered.

acknowledgements: >-
