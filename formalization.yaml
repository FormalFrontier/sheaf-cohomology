# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "sheaf-cohomology"
  description: >-
    Compact-open section colimits, quasi-flasque exactness and acyclicity,
    resolution comparisons, local cohomology, right-derived pushforward
    comparisons, pullback coherence, native sheafed-space cone pullbacks and cocones
    and their cone-wise additive-to-Type forgetting and ordinary-colimit desc
    compatibility, varying-base native diagram and cone pushforwards and their
    additive-to-Type coefficient transport, native cone reconstruction from
    pullback cocones, a conditional native sheafed-space limit criterion and
    actual limit construction from coefficient colimits and local sheafification,
    named native-to-space limit preservation and same-universe cofiltered
    native-limit preservation under additive-to-Type coefficient forgetting,
    a fixed-base converse from actual native and underlying-space limits
    to the actual projection-mate sheaf colimit,
    commuting-square transitions
    and their additive-to-Type forgetful compatibility, open base
    change and the forgetful functor from abelian-group sheaves to Type-valued
    sheaves in Lean.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Sheaf cohomology, compact-open colimits, pullback and open base change"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical mathematical constructions implemented using native mathlib
      sheaves, limits, Ext and derived-functor infrastructure. No mathematical
      novelty or approval by human authors is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating compact-open, quasi-flasque and cohomological mathematics.
      Detailed passage correspondence, hypotheses and remaining source gaps
      are tracked separately; this metadata makes no source-coverage claim.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Uses native category-theoretic limits, sheafification, stalks, Ext,
      injective resolutions and right-derived functors at mathlib revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5, with Lean v4.34.0-rc2.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and the Hive task
        environment for development, independent review and maintenance.
  notes: >-
    Different agent executions author and independently review substantive
    candidates. No human peer review or source-author endorsement is inferred.
    Unverified model identities, project-wide costs and performance measurements
    are omitted.

status:
  scope: >-
    Reusable sheaf-cohomological APIs under each declaration's actual category,
    topology, sheafification, Ext and universe assumptions. The positive
    local-cohomology/right-derived comparison has a shared universe parameter
    and requires positive degree. Sheaf-specific functorial flasque-resolution
    and higher-direct-image filtered-colimit assemblies are fixed at universe
    zero. The additive-to-Type underlying-sheaf functor commutes with pullback
    through a canonical natural mate for arbitrary same-universe spaces and maps;
    it preserves same-universe filtered colimits with a literal colimit.post
    comparison and its stage law. Generic commuting-square transitions use the
    native concrete-category pullback adjunction and satisfy the forward strict
    mate, target naturality, identity and arbitrary pasting laws. For arbitrary
    same-universe commuting squares and additive pullback stages, forgetting
    commutes with the literal native transition to Type-valued sheaves through
    the canonical pullback comparison; strict pushforward objects, maps and
    square comparisons supply the bridge. An arbitrary cone of native
    sheafed-space underlying spaces induces a diagram of pullback sheaves,
    provided the coefficient category satisfies the concrete, limits/colimits,
    forgetful preservation and reflection assumptions of the native pullback
    adjunction. An actual native sheafed-space cone induces a sheaf cocone
    with vertex sheaf as point and projection mates as legs, without a
    limiting-cone or colimiting-cocone assertion. Additive sheafed spaces
    forget to Type-valued ones through
    the native mapPresheaf functor, with strict underlying-space/presheaf
    equalities and an actual-arrow pullback mate. The native Type-valued
    pullback diagram of the forgotten additive sheafed-space diagram is
    naturally isomorphic to the forgotten additive pullback diagram over
    the same literal cone vertex and projections, through the canonical
    forward and inverse components, without a limiting, filtered,
    nonempty, geometric or stage-isomorphism premise. For an actual native
    additive cone, the Type-valued projection-mate legs agree with the
    forgotten additive legs. With precisely three ordinary colimit witnesses,
    the canonical comparison commutes with desc to the vertex sheaves.
    Neither desc invertibility nor colimitingness, a Ringed result or a
    final additive endpoint is claimed.
    A natural family of continuous maps induces a direct-image diagram of
    native sheafed spaces, and actual compatible cones induce a native target
    cone. These constructors need only a coefficient category; their stage
    and projection mate characterizations require the stronger native
    pullback-adjunction assumptions. No Cartesian or limiting square/cone,
    stage isomorphism or coefficient-changing theorem is assumed by these
    generic constructors. The additive-to-Type coefficient-diagram comparison
    gives strict equality of forgotten native direct-image diagrams and
    an identity-vertex isomorphism of compatible cones after diagram
    transport, together with canonical pullback-comparison laws for actual
    mates. It uses a shared universe for spaces,
    additive groups and sets, and an arbitrary small indexing category;
    no limit, filteredness, nonemptiness or stage isomorphism is required.
    An actual cone of underlying spaces and an actual cocone of its pullback
    sheaves reconstruct a native sheafed-space cone. Its projections are the
    adjoints of the supplied legs; the cocone equations prove cone coherence.
    Forgetting recovers the whole space cone literally, and the forward
    construction recovers the supplied cocone after that equality transport.
    The mate converse uses an explicit base equation. That reconstruction
    alone asserts no limiting or colimiting property. A separate native-limit
    criterion derives IsLimit of an actual native cone from IsLimit of its
    actual forgotten space cone and IsColimit of its actual projection-mate
    sheaf cocone. It derives native lifts, projection equations and uniqueness
    through pullback composition comparisons and mapped-colimit uniqueness,
    and applies to the reconstructed cone. The concrete coefficient category
    satisfies the native pullback-adjunction limits/colimits and forgetful
    preservation/reflection hypotheses; index object and morphism universes
    remain independent. No filteredness, nonemptiness or stage isomorphism
    is required. A further named construction supplies the actual sheaf colimit
    from coefficient colimits of the index shape and weak sheafification at the
    chosen space-cone vertex, installing the existing site-sheaf colimit
    instance locally for the TopCat.Sheaf wrapper. It constructs a native
    LimitCone over an actual base limit, with exact base, sheaf, projection and
    colimit-leg readbacks, and a named HasLimit witness over a selected base
    limit. Type and additive Fin 3 clients and a genuine empty-index limit
    construct their sheaf colimits rather than assume them. There is no global
    HasLimits instance, unrestricted-large-diagram result, converse, Ringed
    extension or coefficient-forget compatibility for the limit construction.
    Named native-to-space preservation witnesses use that genuine construction
    and equality of its whole forgotten cone to derive ordinary PreservesLimit
    for every limiting native cone of the diagram. One uses a supplied space
    limit, and the other chooses it; coefficient shape-colimits and weak
    sheafification at the actual selected vertex remain explicit. The native
    space and coefficient-carrier universes agree, while index object and
    morphism universes remain independent. This is not reflection of limits
    or preservation under forgetting coefficients by those two generic witnesses.
    Separately, for a same-universe small filtered J, additive-to-Type native
    coefficient forgetting preserves limits of every diagram on J opposite.
    The proof transports the actual projection-mate cocone through filtered
    sheaf-colimit preservation and the cone-wise comparison, then uses a
    genuine constructed native limit. Named per-diagram and shape witnesses
    apply to all limiting cones; a chosen-space-cone helper states its local
    weak sheafification assumption. No empty or arbitrary shape, reflection
    or creation of limits is asserted by this coefficient-forgetting result.
    Separately, AlgebraicGeometry.SheafedSpace.isColimit_conePullbackCocone_of_isLimit
    in SheafCohomology/ConePullbackLimitConverse.lean derives IsColimit of the
    actual projection-mate cocone from both IsLimit C and IsLimit of the actual
    forgotten space cone. The same module's
    AlgebraicGeometry.SheafedSpace.nonempty_isLimit_iff_isColimit_conePullbackCocone
    gives the Nonempty equivalence under that actual base-limit hypothesis,
    reusing the forward criterion. Native concrete-coefficient assumptions
    and independent index universes remain; this adds no filteredness,
    nonemptiness, sheaf-colimit existence or weak-sheafification premise and
    does not reflect native limits without the separate base-limit witness.
    No new global preservation instance, full
    theory, arbitrary-universe wrapper or whole-source completion is asserted.

