    note: >-
      Uses the spectral limit-cylinder criterion at official published commit
      452b7b7be1bea76434cd083b1019a26f96b4ab30, with inherited official
      ideal-completion commit 001e3b7508184ecd51e0d86177cb1d54508bf59d.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake, Git and the Hive task
        environment for development, independent review and maintenance.
  notes: >-
    Different agent executions author and independently review substantive
    candidates. No human peer review or source-author endorsement is inferred.
    Unverified model identities, project-wide costs and performance measurements
    are omitted.

status:
  scope: >-
    The accepted, officially published 97-module predecessor includes seven native
    commutative-ring coefficient-forgetting producer leaves, one ring
    global-section producer and one named public ordinary-import unique-lift
    example. The published 99-module predecessor adds an original-open
    commutative-ring cylinder producer and four private ordinary-import clients.
    The literal restricted tail-stage sections compare to the original cone's
    named open; the restricted leg and the original-stage law use the actual
    cone projections and both equality transports in CommRingCat. Under an
    actual original limit, directed preorder, spectral original stages and
    transitions, and a compact possibly-empty stage open, this comparison is
    invertible and every section has a representative at some tail stage, not
    necessarily at any fixed stage. No nonempty, Nontrivial or
    transition-surjectivity premise is introduced. The 103-module library
    also includes the generic stage-open restriction transformations with
    identity and composition, their colimit presheaf under the exact
    per-open HasColimit family, and a comparison natural for the literal
    inverse-image-open target of any original cone. Its original-stage law
    preserves both equality transports. The ring/additive restriction squares
    identify the prior official arrows by their coprojection laws; no all-open
    IsIso, chosen limiting cone, spectrality or compactness is asserted by
    these arrows. The later actual transition-pullback open at index j yields
    a final inclusion into the original principal tail, literal native and
    section diagram isomorphisms, both colimit-existence directions and a
    canonical colimit iso and coprojection law using one local earlier
    HasColimit. The comparison square for any original cone has the forward
    target equality cast, without an all-open IsIso or successive-tail
    coherence claim. Seven inherited private clients exercise original-stage
    sections, proper and empty opens and restriction laws; four new private
    clients check tail coprojections and generic/ring/additive squares. The canonical
    pullback comparison is the mate of the original ring unit, the filtered
    sheaf-colimit comparison is literal colimit.post, and the native cocone
    uses the original projection mates. Cofiltered preservation assumes a
    small same-universe filtered index, not a global instance or arbitrary
    shape; the ring global-section comparison needs an actual limiting cone
    with spectral original stages and transitions. Its stage theorem supplies
    some stage representative for each section, not fixed-stage surjectivity;
    neither result assumes nonempty stage spaces. The 67 selected results
    below are a curated public API list, not the complete declaration/axiom
    census. The prior 88-module scope and dated lifecycle statements below
    remain historical. This implemented scope does not itself certify review,
    acceptance or publication of a particular revision.
    Reusable sheaf-cohomological APIs under each declaration's actual category,
    topology, sheafification, Ext and universe assumptions. The positive
    local-cohomology/right-derived comparison has a shared universe parameter
    and requires positive degree. Sheaf-specific functorial flasque-resolution
    and higher-direct-image filtered-colimit assemblies are fixed at universe
    zero. The additive-to-Type underlying-sheaf functor commutes with pullback
    through a canonical natural mate for arbitrary same-universe spaces and maps;
    it preserves same-universe filtered colimits with a literal colimit.post
    comparison and its stage law. Generic commuting-square transitions use the
    native concrete-category pullback adjunction and satisfy the forward strict
    mate, target naturality, identity and arbitrary pasting laws. For arbitrary
    same-universe commuting squares and additive pullback stages, forgetting
    commutes with the literal native transition to Type-valued sheaves through
    the canonical pullback comparison; strict pushforward objects, maps and
    square comparisons supply the bridge. An arbitrary cone of native
    sheafed-space underlying spaces induces a diagram of pullback sheaves,
    provided the coefficient category satisfies the concrete, limits/colimits,
    forgetful preservation and reflection assumptions of the native pullback
    adjunction. An actual native sheafed-space cone induces a sheaf cocone
    with vertex sheaf as point and projection mates as legs, without a
    limiting-cone or colimiting-cocone assertion. Additive sheafed spaces
    forget to Type-valued ones through
    the native mapPresheaf functor, with strict underlying-space/presheaf
    equalities and an actual-arrow pullback mate. The native Type-valued
    pullback diagram of the forgotten additive sheafed-space diagram is
    naturally isomorphic to the forgotten additive pullback diagram over
    the same literal cone vertex and projections, through the canonical
    forward and inverse components, without a limiting, filtered,
    nonempty, geometric or stage-isomorphism premise. For an actual native
    additive cone, the Type-valued projection-mate legs agree with the
    forgotten additive legs. With precisely three ordinary colimit witnesses,
    the canonical comparison commutes with desc to the vertex sheaves.
    Neither desc invertibility nor colimitingness, a Ringed result or a
    final additive endpoint is claimed.
    A natural family of continuous maps induces a direct-image diagram of
    native sheafed spaces, and actual compatible cones induce a native target
    cone. These constructors need only a coefficient category; their stage
    and projection mate characterizations require the stronger native
    pullback-adjunction assumptions. No Cartesian or limiting square/cone,
    stage isomorphism or coefficient-changing theorem is assumed by these
    generic constructors. The additive-to-Type coefficient-diagram comparison
    gives strict equality of forgotten native direct-image diagrams and
    an identity-vertex isomorphism of compatible cones after diagram
    transport, together with canonical pullback-comparison laws for actual
    mates. It uses a shared universe for spaces,
    additive groups and sets, and an arbitrary small indexing category;
    no limit, filteredness, nonemptiness or stage isomorphism is required.
    An actual cone of underlying spaces and an actual cocone of its pullback
    sheaves reconstruct a native sheafed-space cone. Its projections are the
    adjoints of the supplied legs; the cocone equations prove cone coherence.
    Forgetting recovers the whole space cone literally, and the forward
    construction recovers the supplied cocone after that equality transport.
    The mate converse uses an explicit base equation. That reconstruction
    alone asserts no limiting or colimiting property. A separate native-limit
    criterion derives IsLimit of an actual native cone from IsLimit of its
    actual forgotten space cone and IsColimit of its actual projection-mate
    sheaf cocone. It derives native lifts, projection equations and uniqueness
    through pullback composition comparisons and mapped-colimit uniqueness,
    and applies to the reconstructed cone. The concrete coefficient category
    satisfies the native pullback-adjunction limits/colimits and forgetful
    preservation/reflection hypotheses; index object and morphism universes
    remain independent. No filteredness, nonemptiness or stage isomorphism
    is required. A further named construction supplies the actual sheaf colimit
    from coefficient colimits of the index shape and weak sheafification at the
    chosen space-cone vertex, installing the existing site-sheaf colimit
    instance locally for the TopCat.Sheaf wrapper. It constructs a native
    LimitCone over an actual base limit, with exact base, sheaf, projection and
    colimit-leg readbacks, and a named HasLimit witness over a selected base
    limit. Type and additive Fin 3 clients and a genuine empty-index limit
    construct their sheaf colimits rather than assume them. There is no global
    HasLimits instance, unrestricted-large-diagram result, converse, Ringed
    extension or coefficient-forget compatibility for the limit construction.
    Named native-to-space preservation witnesses use that genuine construction
    and equality of its whole forgotten cone to derive ordinary PreservesLimit
    for every limiting native cone of the diagram. One uses a supplied space
    limit, and the other chooses it; coefficient shape-colimits and weak
    sheafification at the actual selected vertex remain explicit. The native
    space and coefficient-carrier universes agree, while index object and
    morphism universes remain independent. This is not reflection of limits
    or preservation under forgetting coefficients by those two generic witnesses.
    Separately, for a same-universe small filtered J, additive-to-Type native
    coefficient forgetting preserves limits of every diagram on J opposite.
    The proof transports the actual projection-mate cocone through filtered
    sheaf-colimit preservation and the cone-wise comparison, then uses a
    genuine constructed native limit. Named per-diagram and shape witnesses
    apply to all limiting cones; a chosen-space-cone helper states its local
    weak sheafification assumption. No empty or arbitrary shape, reflection
    or creation of limits is asserted by this coefficient-forgetting result.
    Separately, AlgebraicGeometry.SheafedSpace.isColimit_conePullbackCocone_of_isLimit
    in SheafCohomology/ConePullbackLimitConverse.lean derives IsColimit of the
    actual projection-mate cocone from both IsLimit C and IsLimit of the actual
    forgotten space cone. The same module's
    AlgebraicGeometry.SheafedSpace.nonempty_isLimit_iff_isColimit_conePullbackCocone
    gives the Nonempty equivalence under that actual base-limit hypothesis,
    reusing the forward criterion. Native concrete-coefficient assumptions
    and independent index universes remain; this adds no filteredness,
    nonemptiness, sheaf-colimit existence or weak-sheafification premise and
    does not reflect native limits without the separate base-limit witness.
    Separately, ConePullbackSections constructs actual unit and restricted
    adjoint section maps and their arbitrary-open triangle equation for
    Type-valued sheaves. For any small native diagram and any cone of its
    underlying spaces, it gives a natural transformation from N.rightOp
    composed with native global sections to top-open sections of conePullback.
    Under the two individual HasColimit hypotheses it gives the ordinary
    colimMap stage-leg equation. No spectrality, limiting cone, filteredness
    or nonempty index is required. No invertibility, finite-stage equality,
    descent or gluing is asserted by this section-transport unit.
    PullbackLocalSections uses the actual inverse-image sheaf and adjunction
    unit for arbitrary same-universe spaces and Type-valued sheaves. Its stalk
    comparison, local representation and equality neighborhood require no
    compactness or spectral-map hypothesis. Only finite local representation
    assumes a prespectral source and compact source open; target opens need
    not be compact. It supplies no global section surjectivity, stage equality,
    finite-stage gluing or colimit endpoint.
    Separately, NativeStageSectionEquality reflects equality under the literal
    limit-projection pullback unit at one native stage, on compact opens and
    global sections of the existing N.rightOp composed with SheafedSpace.Γ.
    It assumes a same-universe small filtered category, an actual limiting
    underlying-space cone, spectral stage spaces and spectral transition maps.
    Stages need not be inhabited and maps need not be surjective. This unit
    proves no gluing, finite simultaneous equality or colimit-map invertibility.
    NativeStageSectionLifting separately lifts each global section of the actual
    cone-pullback sheaf to a native global section after one filtered transition
    under those same spectral-limit hypotheses. It uses literal projection-unit
    and transition maps, finite whole-stage descent and sheaf gluing, including
    empty stages and empty finite covers. It adds no inhabitedness or desired
    comparison premise and does not assert colimMap or endpoint invertibility.
    Separately, NativeStageSectionColimit proves the named IsIso theorem for
    the literal colimMap of ConePullbackSections.coneSections, from native
    stage global sections to top-open cone-pullback sections. It combines
    native stage equality and lifting under those same-universe small
    filtered, actual-limit and spectral-stage/map hypotheses. No inhabitance,
    transition injectivity or desired-isomorphism premise is added, and the
    theorem is not a global instance. Its ordinary-import clients are private.
    NativeLimitGlobalSections then constructs the global-section cocone from
    the actual projections of limitConeOfSpaceCone and its literal colimit.desc
    comparison. Its stage law and factorization use the same local sheaf-colimit
    instance as the native construction. The named
    isIso_nativeGlobalSectionsComparison combines moving-stage and fixed-base
    comparisons under the same-universe small filtered, actual-limit and
    spectral-stage/map hypotheses, with no inhabited-stage or desired-IsIso
    premise and no global instance. Its private ordinary-import client detects
    coprojection equality by actual native projection images. Source endpoints,
    additive extensions and arbitrary colimit-choice identifications remain separate.
    NativeOpenRestriction constructs canonical restriction arrows for
    SheafedSpace.{v+1,v,v} C with C in Type(v+1) and Category.{v} C,
    over inverse-image opens, using the existing
    open-immersion lift. Native inclusion, uniqueness, identity and composition
    equations retain named-open equality transports. The actual global-section
    map agrees with the original presheaf morphism component after those
    transports. Type and additive clients use these same declarations, with
    explicit casts in the composed component equation. No concrete coefficient
    category, extra limit, compactness, spectrality or nonemptiness is required;
    principal-tail and cylinder limits are not asserted by this unit.
    The separate NativeCylinderLimit unit constructs the actual restriction
    diagram over a principal tail of a directed preorder with an explicit
    distinguished index, for C in Type(v+1) with Category.{v} C inferred from
    the original SheafedSpace.{v+1,v,v} C diagram. An arbitrary original native
    limit cone and stage open induce its literal restricted cone and a constructed
    native IsLimit;
    the restricted limit is not an input assumption. Native lift equations
    and uniqueness follow from finality, open-immersion factorization and
    monic cancellation, without linear order, spectrality or inhabited opens
    or spaces. Separate Type and additive private ordinary-import clients apply
    this same limit to arbitrary restricted cones and recover the original
    projection equation without duplicating a Type wrapper.
    This unit adds no chosen-limit isomorphism, restricted-diagram section
    comparison, spectral transfer or source endpoint.
    The separate NativeCylinderComparison constructs the chosen native-limit
    isomorphism to the literal restriction, both native projection equations
    and both underlying identity-map laws. Its actual restricted global-section
    comparison uses Gamma contravariantly on the inverse isomorphism and reads
    at original-stage sections with explicit restriction-object and inverse-image
    equality transports. A directed preorder, explicit index, actual original
    native limit and arbitrary possibly empty stage open suffice; this unit
    assumes no spectrality and asserts no spectral invertibility of that comparison.
    NativeSpectralCylinderSections separately proves that the actual restricted
    comparison is invertible when original stages and transitions are spectral
    and the chosen stage open is compact, possibly empty. It invokes the
    coefficient-generic NativeSpectralCylinder helper for spectrality of literal
    restricted stages and arrows via compact-open preimages and the actual
    inclusion square, then identifies the opaque comparison through
    public coprojection laws. No desired IsIso, restricted-limit or surjectivity
    premise is added. Its private ordinary-import client cancels the comparison
    on original-stage sections with both restriction-object and inverse-image casts.
    NativeAdditiveGlobalSections defines the original additive cone's global-section
    cocone, colimit.desc comparison and literal original-projection stage law.
    Their inferred signatures require neither filteredness nor a limiting cone.
    With small same-universe filtered indexing, an actual original native limit,
    and spectral original stages and transition maps, that comparison is an
    isomorphism. The proof uses full native cone/diagram forgetting and forward
    colimit.post, without duplicating the Type spectral proof. Its private
    ordinary-import client derives equality after an actual later transition
    from original projection equality, and proves the converse. No additive
    restriction or compact-cylinder extension is supplied by this unit.
    NativeSpectralCylinder establishes spectrality of literal restricted
    stages and transitions for arbitrary C in Type(v+1) with Category(v) C
    from spectral original stages/maps and compact possibly-empty U0. Its
    topology transfer uses no cone or limit assumption and replaces the old
    Type-only inline argument without changing that Type public conclusion.
    NativeAdditiveCylinderSections constructs an additive comparison from
    sections of actual principal-tail restrictions to original-cone sections
    on the named inverse-image open. Its definition, colimit-leg law and
    original-stage arrow law with both casts require only a preorder; no
    directedness, original limit or spectrality is assumed there. Given an
    original native limiting cone, spectral original stages and maps, and
    compact possibly-empty U0, the IsIso endpoint locally supplies tail
    directedness and filteredness and uses a constructed restricted native
    limit and the additive-global spectral comparison. A named private
    ordinary-import client cancels on actual original-projection sections
    with both transports; neither the desired isomorphism nor nonempty U0
    is an assumption. Donor leaf acceptance is not destination registration,
    source correspondence or coverage.
    No new global preservation instance, full
    theory, arbitrary-universe wrapper or whole-source completion is asserted.
